worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    limit_req_zone $binary_remote_addr zone=search_limit:1m rate=10r/m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }
        location = /api/search {
            access_log off;
            limit_req zone=search_limit burst=3 nodelay;
            limit_req_status 429;
            limit_except GET { deny all; }
            resolver 127.0.0.11 valid=10s;
            set $search_backend http://search:8080;
            proxy_pass $search_backend/search?q=$arg_q&format=json&categories=general&safesearch=1;
            proxy_read_timeout 20s;
            proxy_connect_timeout 5s;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "no-store" always;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
