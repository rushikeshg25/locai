services:
  locai:
    build:
      context: .
      args:
        VITE_RUNTIME_BASE_URL: ${VITE_RUNTIME_BASE_URL:-}
    image: locai:local
    ports:
      - "127.0.0.1:${PORT:-4174}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  search:
    image: searxng/searxng@sha256:ffad724acd87b8dd312328d18da88ddd42e5c4b1d23231594662620053c13cae
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-locai-local-search-not-for-public-hosting}
    restart: unless-stopped
