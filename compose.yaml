services:
  local-writer:
    build:
      context: .
      args:
        VITE_RUNTIME_BASE_URL: ${VITE_RUNTIME_BASE_URL:-}
    image: local-writer:local
    ports:
      - "127.0.0.1:${PORT:-4174}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
